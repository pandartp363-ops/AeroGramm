name: Build AeroGram APK
on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK + CMake
        run: |
          yes | sdkmanager "ndk;21.4.7075529" "cmake;3.10.2.4988" || true

      - name: Inject api_id / api_hash
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/APP_ID = [0-9]*;/APP_ID = ${{ secrets.TG_API_ID }};/" $F
          sed -i "s/APP_HASH = \"[a-f0-9]*\"/APP_HASH = \"${{ secrets.TG_API_HASH }}\"/" $F

      - name: Apply AeroGram files (icons, screens, manifest)
        env:
          AERO_SERVER: ${{ secrets.AERO_SERVER }}
          AERO_BOT: ${{ secrets.AERO_BOT }}
        run: bash aerogram-assets/apply.sh

      - name: Rename app
        run: |
          sed -i 's/org\.telegram\.messenger\.web/com.aerogram.app/' TMessagesProj_App/build.gradle
          grep -rl '<string name="AppName">' TMessagesProj/src/main/res/values/strings.xml \
            | xargs sed -i 's#<string name="AppName">[^<]*</string>#<string name="AppName">AeroGram</string>#'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Sign
        run: |
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ks.jks
          APK=$(ls TMessagesProj_App/build/outputs/apk/afat/release/*.apk | head -1)
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $ANDROID_HOME/build-tools/$BT/zipalign -f 4 "$APK" aligned.apk
          $ANDROID_HOME/build-tools/$BT/apksigner sign --ks ks.jks \
            --ks-pass pass:${{ secrets.KS_PASS }} --ks-key-alias ${{ secrets.KS_ALIAS }} \
            --key-pass pass:${{ secrets.KS_PASS }} --out AeroGram.apk aligned.apk

      - uses: actions/upload-artifact@v4
        with: { name: AeroGram-apk, path: AeroGram.apk }
